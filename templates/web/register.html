<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Care Mate</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo h1 { font-size: 28px; color: #333; font-weight: 700; }
        .logo p { color: #888; margin-top: 8px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block; margin-bottom: 6px;
            font-size: 14px; font-weight: 500; color: #555;
        }
        input {
            width: 100%; padding: 12px 16px;
            border: 2px solid #e1e1e1; border-radius: 8px;
            font-size: 15px; transition: border-color 0.2s; outline: none;
        }
        input:focus { border-color: #667eea; }
        .btn {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error {
            background: #fee; color: #c33;
            padding: 12px; border-radius: 8px;
            margin-bottom: 16px; font-size: 14px; display: none;
        }
        .footer {
            text-align: center; margin-top: 24px;
            font-size: 14px; color: #888;
        }
        .footer a { color: #667eea; text-decoration: none; font-weight: 500; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🤝 Care Mate</h1>
            <p>Tạo tài khoản mới</p>
        </div>
        <div class="error" id="errorMessage"></div>
        <div class="success" id="successMessage" style="display:none;background:#efe;color:#393;padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px;"></div>
        <form id="registerForm">
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" name="username" required placeholder="Nhập tên đăng nhập">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Nhập email (không bắt buộc)">
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" required minlength="6" placeholder="Ít nhất 6 ký tự">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" required placeholder="Nhập lại mật khẩu">
            </div>
            <button type="submit" class="btn" id="submitBtn">Đăng ký</button>
        </form>
        <div class="footer">
            Đã có tài khoản? <a href="/api/web/">Đăng nhập</a>
        </div>
    </div>
    <script>
        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorEl = document.getElementById('errorMessage');
        const successEl = document.getElementById('successMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (form.password.value !== form.confirmPassword.value) {
                errorEl.textContent = 'Mật khẩu xác nhận không khớp';
                errorEl.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Đang xử lý...';

            try {
                const res = await fetch('/api/auth/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: form.username.value,
                        email: form.email.value,
                        password: form.password.value,
                    }),
                });
                const data = await res.json();
                if (!res.ok) {
                    const msgs = Object.values(data.data || {}).flat().join(', ');
                    throw new Error(msgs || 'Đăng ký thất bại');
                }
                successEl.textContent = 'Đăng ký thành công! Đang chuyển hướng đến trang đăng nhập...';
                successEl.style.display = 'block';
                form.reset();
                setTimeout(() => { window.location.href = '/api/web/'; }, 1500);
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Đăng ký';
            }
        });
    </script>
</body>
</html>
